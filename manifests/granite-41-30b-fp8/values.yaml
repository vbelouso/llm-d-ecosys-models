modelArtifacts:
  uri: "pvc://granite-41-30b-fp8-pvc/hub/ibm-granite/granite-4.1-30b-fp8"
  name: "ibm-granite/granite-4.1-30b-fp8"
  size: 60Gi
  readOnly: false
  authSecretName: "llm-d-hf-token"
  labels:
    app: "vllm-granite-41-30b-fp8"

routing:
  servicePort: 8000
  proxy:
    enabled: false

accelerator:
  type: nvidia

decode:
  replicas: 1
  strategy:
    type: Recreate
  extraConfig:
    securityContext:
      fsGroupChangePolicy: OnRootMismatch
  containers:
    - name: "vllm"
      image: "vllm/vllm-openai:v0.19.0"
      modelCommand: vllmServe
      args:
        - "--enable-auto-tool-choice"
        - "--tool-call-parser"
        - "granite4"
        - "--disable-access-log-for-endpoints"
        - "/health,/metrics,/ping"
        - "--trust-remote-code"
      env:
        - name: HOME
          value: /tmp
        - name: HF_HOME
          value: /tmp/huggingface
      mountModelVolume: true
      extraConfig:
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 5

prefill:
  create: false
